name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make identifiers
      - name: Fail on commit emails that aren't GitHub no-reply addresses
        # Prints hashes only, because these logs are public.
        run: >
          git log --format='%h %ae %ce' |
          awk '{ for (i = 2; i <= 3; i++) if ($i !~ /(@users\.noreply\.github\.com|^noreply@github\.com)$/) { print $1; bad = 1 } } END { exit bad }'

  # Not a required check while the xcode-27 runner image is in preview. Require it in the main ruleset once it
  # isn't.
  app:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint test
      - name: Test on Simulator, unsigned
        run: >
          xcodebuild -scheme Temper
          -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0'
          -resultBundlePath "$RUNNER_TEMP/Temper.xcresult"
          -quiet
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult
          path: ${{ runner.temp }}/Temper.xcresult
          retention-days: 7
